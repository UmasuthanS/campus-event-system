spring.application.name=campus-event-system
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/campus_events?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:false}
app.seed.clubs.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

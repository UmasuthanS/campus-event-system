spring.application.name=campus-event-system
# Persistent local development configuration; environment variables still take precedence.
spring.config.import=optional:file:./config/local.properties
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/campus_events?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:false}
app.seed.clubs.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:campus-event-system}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
spring.jackson.deserialization.fail-on-unknown-properties=true
# Prevent framework validation logs from printing rejected password values.
logging.level.org.springframework.web=INFO

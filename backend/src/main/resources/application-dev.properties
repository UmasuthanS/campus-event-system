# Opt-in local development: requires a reachable MongoDB instance.
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:true}
app.seed.clubs.enabled=${SEED_CLUBS:true}

# Explicit opt-in only. Identity and credentials have no defaults.
app.bootstrap.super-admin.enabled=${BOOTSTRAP_SUPER_ADMIN:false}
app.bootstrap.super-admin.full-name=${BOOTSTRAP_SUPER_ADMIN_NAME:}
app.bootstrap.super-admin.registration-number=${BOOTSTRAP_SUPER_ADMIN_REGISTRATION_NUMBER:}
app.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}

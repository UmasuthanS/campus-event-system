# Opt-in local development: requires a reachable MongoDB instance.
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:true}
app.seed.clubs.enabled=${SEED_CLUBS:true}

# Explicit opt-in only. Identity and credentials have no defaults.
app.bootstrap.super-admin.enabled=${BOOTSTRAP_SUPER_ADMIN:false}
app.bootstrap.super-admin.full-name=${BOOTSTRAP_SUPER_ADMIN_NAME:}
app.bootstrap.super-admin.registration-number=${BOOTSTRAP_SUPER_ADMIN_REGISTRATION_NUMBER:}
app.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}

# Optional demo Club Admin accounts; credentials have no defaults.
app.seed.club-admins.enabled=${SEED_CLUB_ADMINS:false}
app.seed.club-admins.ieee.name=${DEMO_IEEE_ADMIN_NAME:}
app.seed.club-admins.ieee.registration-number=${DEMO_IEEE_ADMIN_REGISTRATION_NUMBER:}
app.seed.club-admins.ieee.email=${DEMO_IEEE_ADMIN_EMAIL:}
app.seed.club-admins.ieee.password=${DEMO_IEEE_ADMIN_PASSWORD:}
app.seed.club-admins.comes.name=${DEMO_COMES_ADMIN_NAME:}
app.seed.club-admins.comes.registration-number=${DEMO_COMES_ADMIN_REGISTRATION_NUMBER:}
app.seed.club-admins.comes.email=${DEMO_COMES_ADMIN_EMAIL:}
app.seed.club-admins.comes.password=${DEMO_COMES_ADMIN_PASSWORD:}
app.seed.club-admins.aiesec.name=${DEMO_AIESEC_ADMIN_NAME:}
app.seed.club-admins.aiesec.registration-number=${DEMO_AIESEC_ADMIN_REGISTRATION_NUMBER:}
app.seed.club-admins.aiesec.email=${DEMO_AIESEC_ADMIN_EMAIL:}
app.seed.club-admins.aiesec.password=${DEMO_AIESEC_ADMIN_PASSWORD:}
